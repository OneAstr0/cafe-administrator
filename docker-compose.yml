version: '3.9'

services:

  postgres:
    image: postgres:15
    container_name: cafe_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: cafe_db
    ports:
      - "5433:5432"

  mysql:
    image: mysql:8
    container_name: cafe_mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cafe_db

    ports:
      - "3307:3306"

    volumes:
      - ./src/main/resources/sql/mysql_init.sql:/docker-entrypoint-initdb.d/init.sql